---
# ═══════════════════════════════════════════════════════════════════════════
#  LOCAL CONFIG — copy to config.yml (gitignored) and fill in.
#
#    cp config.example.yml config.yml
#    $EDITOR config.yml
#    ansible-playbook playbook.yml -e @config.yml
#
#  NEVER commit config.yml — it holds your secrets.
# ═══════════════════════════════════════════════════════════════════════════

# ── Target: the Raspberry Pi ─────────────────────────────────────────────────
ansible_host: "192.168.88.1"      # via the RaspiRouter AP, or LAN IP after first boot
ansible_user: "g1tech"            # SSH user created during SD flash

# ── Your AP (the network your devices join) ──────────────────────────────────
ap_ssid: "RaspiRouter"
ap_password: "CHANGE_ME_strong_password"   # >= 8 chars

# ── Campus WiFi (uplink) ─────────────────────────────────────────────────────
# Three auth modes, chosen by these fields:
#   open network (captive portal):  hotel_open: true
#   WPA-PSK (shared password):      hotel_open: false, hotel_password set
#   WPA2-Enterprise (user account): hotel_identity set (PEAP/MSCHAPv2);
#                                   hotel_password is the account password
hotel_ssid: "WU-Users"
hotel_open: false
hotel_identity: ""                # username for enterprise networks; "" = PSK
hotel_password: ""

# Alternative uplinks, tried in order when the primary is out of range
# (each entry: ssid, and optionally password / open / identity)
# uplink_fallbacks:
#   - { ssid: "WU-RESNET", password: "..." }
#   - { ssid: "HomeWifi", password: "..." }

# ── System ───────────────────────────────────────────────────────────────────
timezone: "America/New_York"

# ── Tailscale (out-of-band management) — OPTIONAL ────────────────────────────
# Reach the Pi from anywhere once it has any connectivity. Omit entirely to
# skip the role. Key from https://login.tailscale.com/admin/settings/keys;
# it lands in a root-only script, never in git.
# tailscale_authkey: "tskey-auth-..."
# tailscale_hostname: "raspirouter"

# ── Optional (defaults live in inventory/group_vars/all/main.yml) ────────────
# ap_channel: 6                   # AP channel ('a'+36+ for 5 GHz AP)
# uplink_band: "auto"             # "24" | "5" | "auto"
# deadman_rollback: true          # auto-revert if provisioning loses the Pi
