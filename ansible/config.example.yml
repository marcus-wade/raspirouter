---
# ═══════════════════════════════════════════════════════════════════════════
#  LOCAL CONFIG — copy to config.yml (gitignored) and fill in.
#
#    cp config.example.yml config.yml
#    $EDITOR config.yml
#    ansible-playbook playbook.yml -e @config.yml
#
#  NEVER commit config.yml — it holds your secrets.
# ═══════════════════════════════════════════════════════════════════════════

# ── Target: the Raspberry Pi ─────────────────────────────────────────────────
ansible_host: "192.168.88.1"      # via the RaspiRouter AP, or LAN IP after first boot
ansible_user: "g1tech"            # SSH user created during SD flash

# ── Your AP (the network your devices join) ──────────────────────────────────
ap_ssid: "RaspiRouter"
ap_password: "CHANGE_ME_strong_password"   # >= 8 chars

# ── Campus WiFi (uplink) ─────────────────────────────────────────────────────
# Wingate University residence network: WingateResnet joins WITHOUT a WiFi
# password; each device then logs in through a captive web page. The Pi joins,
# you complete the web login once from any device behind the Pi, and every
# NATed device shares the session.
hotel_ssid: "WingateResnet"
hotel_open: true                  # true = open join (captive portal after)
hotel_password: ""                # only used if hotel_open: false

# ── System ───────────────────────────────────────────────────────────────────
timezone: "America/New_York"

# ── Optional (defaults live in inventory/group_vars/all/main.yml) ────────────
# ap_channel: 6                   # AP channel ('a'+36+ for 5 GHz AP)
# uplink_band: "auto"             # "24" | "5" | "auto"
# deadman_rollback: true          # auto-revert if provisioning loses the Pi
